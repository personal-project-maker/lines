name: Build Lines Follow (Android)

on:
  push:
    paths:
      - "android/**"
      - "remote.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download the offline speech model
        run: |
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/model
          mv vosk-model-small-en-us-0.15 android/app/src/main/assets/model

      - name: Add the remote control page
        run: |
          mkdir -p android/app/src/main/assets/web
          cp remote.html android/app/src/main/assets/web/remote.html

      - name: Build the app
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LinesFollow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LinesFollow
          path: LinesFollow.apk

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: follow-latest
          name: Lines Follow (latest build)
          body: "Download LinesFollow.apk below on your Android phone and open it to install. Build ${{ github.run_number }}."
          files: LinesFollow.apk
          make_latest: true
